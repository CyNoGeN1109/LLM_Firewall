<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>cynoshield</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/styles.css"/>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">cynoshield</span>
      <span class="brand-tag">PROMPT FIREWALL</span>
    </div>
    <div class="toggle-wrap">
      <span class="fw-label">firewall</span>
      <label class="toggle-switch">
        <input id="firewallToggle" type="checkbox" checked/>
        <span class="toggle-track"><span class="toggle-thumb"></span></span>
      </label>
      <span class="fw-dot on" id="fwDot"></span>
    </div>
  </header>
  <div class="pipeline">
    <span class="pnode" id="pn-in">input</span>
    <span class="parr" id="pa-1">→</span>
    <span class="pnode" id="pn-fw">firewall</span>
    <span class="parr" id="pa-2">→</span>
    <span class="pnode" id="pn-llm">llm</span>
    <span class="parr" id="pa-3">→</span>
    <span class="pnode" id="pn-out">output</span>
    <span class="pspacer"></span>
    <span class="pverdict hidden" id="pipeVerdict"></span>
  </div>
  <div class="messages" id="messages"></div>
  <div class="sys-row hidden" id="sysRow">
    <textarea id="systemPrompt" rows="2" placeholder="system prompt…">You are a helpful assistant. Answer clearly and keep responses practical.</textarea>
  </div>
  <div class="composer-wrap">
    <form id="chatForm" class="composer">
      <textarea id="promptInput" rows="1" placeholder="message…" autocomplete="off"></textarea>
      <div class="composer-btns">
        <button id="settingsToggle" class="cbtn" type="button">sys</button>
        <button id="newChat" class="cbtn" type="button">new</button>
        <button id="exportChat" class="cbtn" type="button">export</button>
        <button id="stopButton" class="cbtn stop hidden" type="button">stop</button>
        <button id="sendButton" class="cbtn send" type="submit">send</button>
      </div>
    </form>
  </div>
  <div class="flow-logs">
    <div class="flow-logs-header">
      <span class="flow-logs-title">FLOW LOG</span>
      <div class="flow-logs-right">
        <button class="clrbtn" id="clearLog" type="button">clear</button>
        <div class="runtime-indicator">
          <span class="rdot" id="runtimeStatus"></span>
          <span class="rlbl" id="runtimeLabel">connecting…</span>
        </div>
      </div>
    </div>
    <div class="log-feed" id="flowLog"></div>
  </div>
</div>
<template id="messageTemplate">
  <div class="msg">
    <span class="msg-who"></span>
    <pre class="msg-text"></pre>
  </div>
</template>
<script src="/app.js"></script>
</body>
</html>
